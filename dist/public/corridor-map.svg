<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Trade corridor map">
  <defs>
    <radialGradient id="glow" cx="35%" cy="60%" r="70%">
      <stop offset="0" stop-color="#12181C"/>
      <stop offset="1" stop-color="#070A0C"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4A72C" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E8C766" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <!-- Stylized continents (abstract polygon silhouettes) -->
  <g fill="#0C1114" stroke="#1E2A30" stroke-width="1.5">
    <!-- South America -->
    <path d="M420 430 L520 420 L580 470 L600 560 L560 680 L510 760 L470 700 L440 600 L410 520 Z"/>
    <!-- North America -->
    <path d="M280 150 L480 130 L560 200 L540 300 L460 380 L380 350 L300 280 Z"/>
    <!-- Africa -->
    <path d="M760 380 L900 360 L960 450 L940 580 L860 660 L790 580 L750 470 Z"/>
    <!-- Europe -->
    <path d="M760 200 L920 180 L960 260 L880 330 L780 300 Z"/>
    <!-- Asia -->
    <path d="M980 160 L1330 140 L1420 260 L1360 420 L1180 480 L1000 400 L960 280 Z"/>
    <!-- Australia -->
    <path d="M1240 620 L1390 610 L1430 700 L1330 760 L1250 720 Z"/>
  </g>
  <!-- graticule dots -->
  <g fill="#1E2A30">
    <circle cx="200" cy="450" r="2"/><circle cx="700" cy="450" r="2"/><circle cx="1100" cy="500" r="2"/>
    <circle cx="600" cy="250" r="2"/><circle cx="1450" cy="500" r="2"/><circle cx="150" cy="650" r="2"/>
  </g>
  <!-- Brazilian origin ports -->
  <g>
    <circle cx="575" cy="600" r="6" fill="#D4A72C"/>
    <circle cx="575" cy="600" r="12" fill="none" stroke="#D4A72C" stroke-opacity="0.4" stroke-width="2"/>
    <text x="592" y="604" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#EDF2F0">SANTOS</text>
    <circle cx="560" cy="640" r="5" fill="#D4A72C"/>
    <text x="520" y="664" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#8FA0A6">PARANAGUÁ</text>
    <circle cx="555" cy="500" r="5" fill="#D4A72C"/>
    <text x="572" y="496" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#8FA0A6">ITAQUI</text>
  </g>
  <!-- Destination nodes -->
  <g>
    <circle cx="1300" cy="360" r="6" fill="#E8C766"/>
    <text x="1315" y="352" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#EDF2F0">SHANGHAI</text>
    <circle cx="830" cy="225" r="6" fill="#E8C766"/>
    <text x="845" y="218" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#EDF2F0">ROTTERDAM</text>
    <circle cx="985" cy="420" r="6" fill="#E8C766"/>
    <text x="1000" y="414" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#EDF2F0">DUBAI</text>
    <circle cx="1090" cy="470" r="6" fill="#E8C766"/>
    <text x="1105" y="464" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#EDF2F0">MUMBAI</text>
  </g>
  <!-- Corridor arcs -->
  <g fill="none" stroke="url(#arc)" stroke-width="2" stroke-dasharray="6 8" stroke-linecap="round">
    <path d="M575 600 Q900 250 1300 360"/>
    <path d="M575 600 Q720 320 830 225"/>
    <path d="M560 640 Q800 420 985 420"/>
    <path d="M555 500 Q820 380 1090 470"/>
  </g>
  <!-- Waypoint dots along Santos-Shanghai arc -->
  <g fill="#D4A72C">
    <circle cx="720" cy="452" r="3"/><circle cx="880" cy="372" r="3"/><circle cx="1060" cy="342" r="3"/><circle cx="1200" cy="342" r="3"/>
  </g>
  <text x="60" y="840" font-family="'IBM Plex Mono', monospace" font-size="14" letter-spacing="4" fill="#55666C">47 TRADE CORRIDORS · 156 PORTS · LIVE ROUTING</text>
</svg>
